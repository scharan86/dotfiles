$mod = SUPER
$terminal = kitty
$fileManager = pcmanfm
$browser = zen-browser
$altBrowser = helium-browser

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

ecosystem {
    enforce_permissions = 1
}

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

# Monitor

monitor = ,preferred,auto,auto

# Autostart
exec-once = $terminal
exec-once = nm-applet & waybar
exec-once = hyprpaper & $browser
exec-once = hyprpm reload -n
# Appearance
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(c6c6c6ee)
    col.inactive_border = rgba(323437aa)  
    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 6
        passes = 1
        vibrancy = 0.1696
    }
}

# Animations

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = true
    bezier = wind, 0.05, 0.85, 0.03, 0.97
    bezier = winIn, 0.07, 0.88, 0.04, 0.99
    bezier = winOut, 0.20, -0.15, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = md3_standard, 0.12, 0, 0, 1
    bezier = md3_decel, 0.05, 0.80, 0.10, 0.97
    bezier = md3_accel, 0.20, 0, 0.80, 0.08
    bezier = overshot, 0.05, 0.85, 0.07, 1.04
    bezier = crazyshot, 0.1, 1.22, 0.68, 0.98
    bezier = hyprnostretch, 0.05, 0.82, 0.03, 0.94
    bezier = menu_decel, 0.05, 0.82, 0, 1
    bezier = menu_accel, 0.20, 0, 0.82, 0.10
    bezier = easeInOutCirc, 0.78, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.48, 0.38, 1
    bezier = easeOutExpo, 0.10, 0.94, 0.23, 0.98
    bezier = softAcDecel, 0.20, 0.20, 0.15, 1
    bezier = md2, 0.30, 0, 0.15, 1
    bezier = OutBack, 0.28, 1.40, 0.58, 1

    animation = border, 1, 1.6, liner
    animation = borderangle, 1, 82, liner, loop
    animation = windowsIn, 1, 3.2, winIn, slide
    animation = windowsOut, 1, 2.8, easeOutCirc
    animation = windowsMove, 1, 3.0, wind, slide
    animation = fade, 1, 1.8, md3_decel
    animation = layersIn, 1, 1.8, menu_decel, slide
    animation = layersOut, 1, 1.5, menu_accel
    animation = fadeLayersIn, 1, 1.6, menu_decel
    animation = fadeLayersOut, 1, 1.8, menu_accel
    animation = workspaces, 1, 4.0, menu_decel, slide
    animation = specialWorkspace, 1, 2.3, md3_decel, slidefadevert 15%
}

# Input

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    repeat_rate = 35
    repeat_delay = 200

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# binds

bind = $mod, Return, exec, $terminal
bind = SUPER SHIFT, Q, killactive,
bind = SUPER SHIFT, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = SUPER SHIFT, F, exec, $fileManager
bind = $mod, V, togglefloating,
bind = $mod, Space, exec, fuzzel
bind = $mod, P, pseudo,
bind = SUPER SHIFT, J, layoutmsg, togglesplit
bind = $mod, F, fullscreen,
# Apps
bind = $mod, B, exec, $browser
bind = SUPER SHIFT, B, exec, $altBrowser
bind = $mod, slash, exec, 1password
bind = $mod, Z, exec, zeditor
bind = $mod, D, exec, hyprctl dispatch workspace 8 && discord
bind = $mod, O, exec, obsidian

# Web Apps
bind = $mod SHIFT, W, exec, hyprctl dispatch workspace 8 && chromium --app=https://web.whatsapp.com
bind = $mod SHIFT, A, exec, hyprctl dispatch workspace 9 && chromium --app=https://crunchyroll.com
bind = $mod SHIFT, N, exec, hyprctl dispatch workspace 9 && chromium --app=https://netflix.com
bind = $mod SHIFT, G, exec, hyprctl dispatch workspace 8 && chromium --app=https://mail.google.com/mail/u/0/
bind = $mod SHIFT, D, exec, hyprctl dispatch workspace 8 && chromium --app=https://drive.google.com
bind = $mod, M, exec, hyprctl dispatch workspace 9 && spotify

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim - | swappy -f -
bind = $mod SHIFT, C, exec, grim -g "$(slurp)" - | wl-copy

# Focus
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize windows
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Multimedia keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Window Rules

windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = helium-fullscreenstate
    match:class = ^helium$

    fullscreen_state = 3 0
}
windowrule {
    name = brave-browser-fullscreenstate
    match:class = ^brave-browser$

    fullscreen_state = 3 0
}

# Workspace Rules
windowrule = workspace 1, match:class ^(kitty)$
windowrule = workspace 2, match:class ^(firefox)$
windowrule = workspace 2, match:class ^(helium)$
windowrule = workspace 2, match:class ^(qutebrowser)$
windowrule = workspace 3, match:class ^(dev\.zed\.Zed)$
windowrule = workspace 3, match:class ^(codium)$
windowrule = workspace 3, match:class ^(obsidian)$
windowrule = workspace 5, match:class ^(thunar)$
windowrule = workspace 8, match:class ^(discord)$
