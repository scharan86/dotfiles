# Core settings
set -g default-terminal "xterm-kitty"
set -ag terminal-overrides ",xterm-kitty:RGB"

set -g history-limit 50000
set -g escape-time 10
set -g repeat-time 600
set -g focus-events on
set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set -gw automatic-rename on
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S / #W"

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Session management
bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind X confirm-before -p "Kill session #S? [y/n]" kill-session
bind s choose-tree -sZ

# Window management
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#{window_name}" "rename-window '%%'"
bind w choose-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind Tab next-window
bind BTab previous-window

bind m move-window -r

# Pane management
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Smart pane navigation (works with vim-tmux-navigator if installed)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

bind z resize-pane -Z           # toggle zoom
bind q display-panes            # show pane numbers
bind Q kill-pane                # kill current pane
bind x confirm-before -p "Kill pane? [y/n]" kill-pane
bind = select-layout even-horizontal
bind + select-layout even-vertical
bind Space next-layout

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Break / join panes
bind b break-pane -d
bind B command-prompt -p "Join pane from (window):" "join-pane -s '%%'"

# Copy mode
set -gw mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind P paste-buffer
bind -T copy-mode-vi / command-prompt -p "Search:" "send -X search-forward '%%'"
bind -T copy-mode-vi ? command-prompt -p "Search back:" "send -X search-backward '%%'"

# Catppuccin Mocha palette

# Base     #1e1e2e    Mantle   #181825    Crust    #11111b
# Surface0 #313244    Surface1 #45475a    Surface2 #585b70
# Overlay0 #6c7086    Overlay1 #7f849c    Overlay2 #9399b2
# Subtext0 #a6adc8    Subtext1 #bac2de    Text     #cdd6f4
# Lavender #b4befe    Blue     #89b4fa    Sapphire #74c7ec
# Sky      #89dceb    Teal     #94e2d5    Green    #a6e3a1
# Yellow   #f9e2af    Peach    #fab387    Maroon   #eba0ac
# Red      #f38ba8    Mauve    #cba6f7    Pink     #f5c2e7
# Flamingo #f2cdcd    Rosewater #f5e0dc

thm_bg="#1e1e2e"
thm_bg1="#181825"
thm_bg2="#313244"
thm_bg3="#45475a"
thm_fg="#cdd6f4"
thm_subtext="#a6adc8"
thm_overlay="#6c7086"
thm_blue="#89b4fa"
thm_mauve="#cba6f7"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_peach="#fab387"
thm_red="#f38ba8"
thm_teal="#94e2d5"
thm_sky="#89dceb"
thm_lavender="#b4befe"
thm_rosewater="#f5e0dc"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"

# Left section
set -g status-left-length 60
set -g status-left "\
#[bg=#89b4fa,fg=#1e1e2e,bold] #S \
#[bg=#313244,fg=#89b4fa,nobold]\
#[bg=#313244,fg=#cdd6f4] #{?client_prefix,#[fg=#f9e2af]C-a ,   }\
#[bg=#181825,fg=#313244]  "

# Right section
set -g status-right-length 120
set -g status-right "\
#[bg=#181825,fg=#45475a]\
#[bg=#45475a,fg=#a6adc8] %H:%M \
#[bg=#45475a,fg=#585b70]\
#[bg=#585b70,fg=#cdd6f4] %d %b \
#[bg=#585b70,fg=#89b4fa]\
#[bg=#89b4fa,fg=#1e1e2e,bold] #h "

# Window list
set -gw window-status-style "bg=#181825,fg=#6c7086"
set -gw window-status-format " #I:#W#{?window_flags,#{window_flags}, } "

set -gw window-status-current-style "bg=#181825,fg=#89b4fa,bold"
set -gw window-status-current-format "\
#[bg=#313244,fg=#181825]\
#[bg=#313244,fg=#89b4fa,bold] #I:#W#{?window_zoomed_flag, Z,} \
#[bg=#181825,fg=#313244]"

set -gw window-status-activity-style "bg=#181825,fg=#f9e2af"
set -gw window-status-bell-style "bg=#181825,fg=#f38ba8,bold"
set -gw window-status-separator ""

# Messages
set -g message-style "bg=#313244,fg=#f9e2af,bold"
set -g message-command-style "bg=#313244,fg=#cba6f7"

# Copy mode colors
set -gw mode-style "bg=#45475a,fg=#cdd6f4"

# Clock
set -gw clock-mode-colour "#89b4fa"
set -gw clock-mode-style 24
