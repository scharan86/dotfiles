# Core settings
set -g default-terminal "xterm-kitty"
set -ag terminal-overrides ",xterm-kitty:RGB"

set -g history-limit 50000
set -g escape-time 10
set -g repeat-time 600
set -g focus-events on
set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set -gw automatic-rename on
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S / #W"

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Session management
bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind X confirm-before -p "Kill session #S? [y/n]" kill-session
bind s choose-tree -sZ

# Window management
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#{window_name}" "rename-window '%%'"
bind w choose-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind Tab next-window
bind BTab previous-window

bind m move-window -r

# Pane management
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Smart pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

bind z resize-pane -Z
bind q display-panes
bind Q kill-pane
bind x confirm-before -p "Kill pane? [y/n]" kill-pane
bind = select-layout even-horizontal
bind + select-layout even-vertical
bind Space next-layout

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Break / join panes
bind b break-pane -d
bind B command-prompt -p "Join pane from (window):" "join-pane -s '%%'"

# Copy mode
set -gw mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind P paste-buffer
bind -T copy-mode-vi / command-prompt -p "Search:" "send -X search-forward '%%'"
bind -T copy-mode-vi ? command-prompt -p "Search back:" "send -X search-backward '%%'"

# Theme
source-file ~/.config/tmux/themes/tokyo.conf
