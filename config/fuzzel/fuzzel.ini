[main]
font=JetBrainsMono NF Medium:size=11.5
dpi-aware=no
prompt="  "
placeholder=Search...
width=30
lines=8
line-height=22
letter-spacing=0
anchor=center
x-margin=0
y-margin=0
match-mode=fzf
fields=filename,name,generic,keywords
show-actions=no
terminal=kitty
layer=overlay
exit-on-keyboard-focus-loss=yes
use-bold=yes

[colors]
background=16161eff
text=c0caf5ff
match=2ac3deff
selection=343a55ff
selection-match=2ac3deff
selection-text=c0caf5ff
border=27a1b9ff

[border]
width=2
radius=8
